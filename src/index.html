<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CacheCapsule</title>
<link rel="stylesheet" href="css/capsule.css">
</head>
<body>
<div id="wrap">
  <div class="pop frosted" id="pop" hidden>
    <div class="head" id="head">
      <h3>缓存保活</h3>
      <span class="pill" id="pill">保活中</span>
    </div>

    <div class="seg" id="seg">
      <button data-ttl="5m" class="on"><b>5 分钟</b><small id="s5">写入 1.25×</small></button>
      <button data-ttl="1h"><b>1 小时</b><small id="s1">写入 2×</small></button>
    </div>

    <div class="row first" style="margin-top:4px">
      <div><div class="lbl">自动保活</div><div class="sub">空闲时按间隔重发缓存前缀，读缓存刷新 TTL</div></div>
      <button class="sw on" id="sw"></button>
    </div>

    <div class="scope"><span><b id="scopeName">5 分钟档</b> 独立设置</span></div>

    <div class="row first">
      <div><div class="lbl">保活间隔</div><div class="sub" id="ivHint">须小于 5:00，建议留 30 秒余量</div></div>
      <div class="ctl"><button id="ivMinus">−</button><input id="iv" value="4:30" inputmode="numeric"><button id="ivPlus">+</button></div>
    </div>
    <div class="row">
      <div><div class="lbl">最多次数</div><div class="sub" id="span">最多保到 ≈ 32 分钟</div></div>
      <div class="ctl"><button id="minus">−</button><span id="max">6</span><button id="plus">+</button></div>
    </div>
    <div class="row" style="display:block">
      <div class="meter">
        <div class="top"><span>下次保活</span><b id="cd">4:30</b></div>
        <div class="bar"><i id="bar" style="width:0%"></i></div>
        <div class="top" style="margin:12px 0 0"><span>已保活</span><b id="cnt">0 / 6</b></div>
        <div class="pips" id="pips"></div>
      </div>
    </div>

    <div class="last">
      <div class="nums" id="last"><span>上次 —</span></div>
      <button class="btn" id="now">立即保活</button>
    </div>
  </div>

  <div class="chip frosted" id="chip" title="点开设置，按住拖动">
    <span class="dot off" id="cdot"></span>
    <span>缓存 <span class="ttl" id="cttl">5m</span></span>
    <span class="sep"></span>
    <span class="count" id="ccount">保活 0/6</span>
    <span class="cd off" id="ccd">—</span>
  </div>
</div>
<script src="js/capsule.js"></script>
</body>
</html>
